default_preset: "300m"
supported_presets: ["92m", "180m", "180m_gqa4", "180m_deep", "300m"]
chat_system_prompt: "Answer clearly and factually. Keep explanations simple, direct, and truthful."

corpus_source_aliases:
  c4: c4_en
  cosmopedia: cosmopedia_v2
  cosmopedia-v2: cosmopedia_v2
  fineweb: fineweb_sample
  fineweb-sample: fineweb_sample
  open-web-math: openwebmath
  open_web_math: openwebmath
  fine-math: finemath
  python-edu: python_edu
  wikipedia: wikipedia_snapshot

defaults:
  # Model
  vocab_size: 24576
  n_layers: 12
  n_heads: 12
  # Number of key/value heads for grouped-query attention. 0 means full
  # multi-head attention with n_kv_heads == n_heads.
  n_kv_heads: 0
  d_model: 768
  d_ff: 3072
  mlp_type: swiglu
  norm_type: rmsnorm
  qk_norm: true
  # Canonical models use RoPE; learned position embeddings are unsupported.
  position_encoding: rope
  rope_theta: 100000.0
  loss_layout: custom
  residual_type: serial
  # Hidden size for SwiGLU MLPs. 0 uses d_ff. Only used when mlp_type=swiglu.
  swiglu_hidden: 2048
  max_seq_len: 2048
  dropout: 0.0
  bias: false
  activation_checkpointing: false
  # Chunk size for the lm_head matmul + cross-entropy in the MLX training
  # path. 0 (default) skips chunking. The MLX default uses a custom VJP for
  # tied lm-head cross-entropy; larger chunks may help on hardware with tight
  # memory budgets; benchmark before changing.
  loss_chunk_size: 0

  # Pretraining
  pretrain_batch_size: 32
  pretrain_grad_accum_steps: 2
  pretrain_lr: 6.0e-4
  pretrain_target_tokens: 0
  pretrain_max_steps: 0
  pretrain_warmup_steps: 200
  pretrain_weight_decay: 0.1
  pretrain_grad_clip: 1.0
  pretrain_eval_interval: 250
  pretrain_eval_batches: 20
  pretrain_checkpoint_interval: 0
  pretrain_patience: 5
  pretrain_optimizer: muon
  pretrain_vmap_accum_step: false
  pretrain_vmap_sync_warmup_steps: 0
  # Learning-rate schedule. "trapezoid" (default) is warmup -> constant-at-peak
  # -> linear-decay (tail controlled by pretrain_trapezoid_decay_frac); on a
  # controlled synthetic next-token task at 92m (60 steps, 3 seeds) it drove
  # final loss ~2.5% lower than cosine for the same compute (0.762 vs 0.782
  # mean). "cosine" is kept as an option for parity with prior runs.
  pretrain_lr_schedule: trapezoid
  pretrain_trapezoid_decay_frac: 0.2

  # SFT
  sft_batch_size: 8
  sft_grad_accum_steps: 2
  sft_lr: 1.5e-5
  sft_epochs: 1
  sft_weight_decay: 0.01
  sft_grad_clip: 1.0
  sft_patience: 5
  sft_download_max_examples: 100000
  sft_optimizer: adamw
  # Unknown files are excluded until they are deliberately added below. This
  # prevents ad-hoc benchmark curricula from silently entering the main mix.
  sft_allow_unconfigured_sources: false
  sft_refusal_sources: [safety_refusal, uncertainty_calibration]

  # Optimizer (Muon)
  allow_adamw_fallback: false
  muon_momentum: 0.95
  muon_nesterov: true
  # DeepSeek-V4 trains with 10 NS iterations; their two-stage coefficient
  # schedule is not supported here, so the tuned single triple is reused.
  muon_ns_steps: 10
  muon_ns_coefficients: [3.4445, -4.7750, 2.0315]
  muon_eps: 1.0e-7
  muon_adjust_lr_fn: match_rms_adamw
  muon_qkv_split: true
  muon_verified: false

  # Generation
  temperature: 0.7
  top_k: 50
  top_p: 1.0

  # Paths
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  chat_data_dir: data/chat
  chat_raw_dir: data/chat_raw
  eval_data_dir: data/eval
  tokenizer_prefix: tokenizer/spakie
  checkpoint_root_dir: checkpoints
  checkpoint_dir: ""

  # Corpus planning
  # 10B train tokens yields a ~10.53B processed-token download target
  # with the default 95/5 train/val split.
  target_train_tokens: 10000000000
  target_processed_tokens: 0
  large_corpus_dir: data/raw/large_corpus
  corpus_report_path: data/processed/corpus_report.json
  token_shard_dir: data/processed/shards
  token_shard_size: 5000000
  min_doc_chars: 400
  max_repeated_line_ratio: 0.25
  max_noise_ratio: 0.35

  # Tier 1 quality filters (Gopher-style + heuristics)
  mean_word_length_min: 3.0
  mean_word_length_max: 10.0
  min_stopword_count: 2
  max_symbol_word_ratio: 0.10
  max_top_2gram_char_share: 0.20
  max_top_3gram_char_share: 0.18
  max_dup_5gram_char_share: 0.15
  max_top_char_share: 0.30

  # Tier 2 quality filter
  max_url_email_line_ratio: 0.30
  # Per-source targets are aspirational because canonical filtering and
  # cross-source dedup happen after download estimates are recorded. They are
  # retained as warnings; hard publication gates operate on the complete
  # corpus and broad source kinds so one exhausted dataset cannot discard an
  # otherwise strong multi-billion-token run.
  minimum_source_completion_ratio: 0.95
  maximum_source_mix_deviation: 0.02
  minimum_corpus_completion_ratio: 0.85
  minimum_kind_completion_ratio: 0.50
  maximum_kind_mix_deviation: 0.06
  maximum_unplanned_source_share: 0.05
  train_split_fraction: 0.95
  estimated_chars_per_token: 4.0

  # Near-duplicate detection (MinHash + LSH)
  near_dup_jaccard_threshold: 0.8
  near_dup_num_perm: 128
  near_dup_shingle_size: 5

  # fastText language identification (lid.176 auto-downloaded on first use)
  langid_min_confidence: 0.65
  langid_model_path: data/models/lid.176.ftz
  langid_model_url: https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz

presets:
  92m:
    n_layers: 12
    d_model: 768
    n_heads: 12
    # 4 KV heads matched the full-MHA loss trajectory step-for-step on a
    # 60-step real-data probe (final loss identical, max delta 0.81%).
    n_kv_heads: 4
    d_ff: 3072
    mlp_type: swiglu
    swiglu_hidden: 2048
    qk_norm: true
    position_encoding: rope
    rope_theta: 100000.0
    activation_checkpointing: false
    pretrain_batch_size: 16
    pretrain_grad_accum_steps: 4
    pretrain_lr: 6.0e-4
    sft_batch_size: 16
    sft_grad_accum_steps: 4
    sft_lr: 1.5e-5
    sft_epochs: 1

  # Deeper, honestly sized 180M-class architecture. RoPE is applied to Q/K
  # after per-head QK RMSNorm; no learned position table is allocated.
  180m:
    n_layers: 24
    d_model: 768
    n_heads: 12
    n_kv_heads: 4
    d_ff: 3072
    mlp_type: swiglu
    swiglu_hidden: 2304
    qk_norm: true
    position_encoding: rope
    rope_theta: 100000.0
    activation_checkpointing: false
    pretrain_batch_size: 12
    pretrain_grad_accum_steps: 4
    sft_batch_size: 8
    sft_grad_accum_steps: 4
    sft_lr: 1.5e-5
    sft_epochs: 1

  # Near-matched-shape 4-KV-head ablation. Sixteen query heads are required
  # because grouped-query attention requires query heads divisible by KV heads.
  180m_gqa4:
    n_layers: 16
    d_model: 896
    n_heads: 16
    n_kv_heads: 4
    d_ff: 3584
    mlp_type: swiglu
    swiglu_hidden: 2048
    activation_checkpointing: false
    pretrain_batch_size: 24
    pretrain_grad_accum_steps: 2
    sft_batch_size: 16
    sft_grad_accum_steps: 4
    sft_lr: 1.5e-5
    sft_epochs: 1

  # Deep/thin, approximately matched-budget architecture ablation. Context
  # uses the canonical 2K window; batch size is reduced to preserve tokens/step.
  180m_deep:
    n_layers: 24
    d_model: 768
    n_heads: 12
    n_kv_heads: 4
    d_ff: 3072
    mlp_type: swiglu
    swiglu_hidden: 1536
    activation_checkpointing: false
    pretrain_batch_size: 18
    pretrain_grad_accum_steps: 2
    sft_batch_size: 12
    sft_grad_accum_steps: 4
    sft_lr: 1.5e-5
    sft_epochs: 1

  # Balanced 300M-class architecture with a parameter-matched SwiGLU
  # feed-forward network, RoPE, and per-head QK RMSNorm.
  300m:
    n_layers: 24
    d_model: 1024
    n_heads: 16
    n_kv_heads: 4
    d_ff: 4096
    mlp_type: swiglu
    swiglu_hidden: 3072
    qk_norm: true
    position_encoding: rope
    rope_theta: 100000.0
    activation_checkpointing: false
    pretrain_batch_size: 16
    pretrain_grad_accum_steps: 3
    # Use memory-safe chunked vmap accumulation. Group size 0 runs the MLX
    # memory probe and selects the largest safe group automatically.
    pretrain_vmap_accum_step: true
    pretrain_vmap_sync_warmup_steps: 10
    pretrain_vmap_group_size: 0
    sft_batch_size: 4
    sft_grad_accum_steps: 2
    sft_grad_clip: 1.0

source_min_doc_chars:
  wikipedia_snapshot: 200
  wikipedia: 200
  arxiv: 220
  stackexchange: 180
  openwebmath: 180
  finemath: 180
  python_edu: 80
  open_corpus: 180
  dictionary: 80

# Domain-aware quality profiles. Prose keeps strict Gopher-style heuristics;
# mathematical notation and source code are allowed to repeat structure and
# use symbols without being misclassified as web spam.
filter_profiles:
  prose:
    apply_word_length: true
    apply_stopwords: true
    apply_language_id: true
    max_symbol_word_ratio: 0.10
    max_noise_ratio: 0.35
    max_repeated_line_ratio: 0.25
    max_url_email_line_ratio: 0.30
    max_top_2gram_char_share: 0.20
    max_top_3gram_char_share: 0.18
    max_dup_5gram_char_share: 0.15
    max_top_char_share: 0.30
  math:
    apply_word_length: false
    apply_stopwords: false
    apply_language_id: true
    max_symbol_word_ratio: 0.45
    max_noise_ratio: 0.50
    max_repeated_line_ratio: 0.45
    max_url_email_line_ratio: 0.35
    max_top_2gram_char_share: 0.35
    max_top_3gram_char_share: 0.32
    max_dup_5gram_char_share: 0.35
    max_top_char_share: 0.40
  code:
    apply_word_length: false
    apply_stopwords: false
    apply_language_id: false
    max_symbol_word_ratio: 1.0
    max_noise_ratio: 0.60
    max_repeated_line_ratio: 0.60
    max_url_email_line_ratio: 0.50
    max_top_2gram_char_share: 0.50
    max_top_3gram_char_share: 0.48
    max_dup_5gram_char_share: 0.45
    max_top_char_share: 0.50

sft_source_limits:
  # `enabled` controls whether download/prepare uses a source. `limit: 0` means
  # uncapped for local raw JSONL sources during prepare; downloaded sources
  # should keep a positive limit to avoid accidental full-dataset pulls.
  DeepSeek-distill-V2:
    # Excluded for the 180M SFT mix after broad evaluation showed that its
    # long, complex answers degraded concise instruction behavior.
    enabled: false
    limit: 0
  custom:
    enabled: true
    limit: 0
  spakie_180m_identity:
    enabled: true
    limit: 0
  assistant_behavior:
    enabled: true
    limit: 0
  anti_echo:
    enabled: true
    limit: 0
  factual_repairs:
    enabled: true
    limit: 0
  safety_refusal:
    enabled: true
    limit: 3000
  uncertainty_calibration:
    enabled: true
    limit: 3000
  format_compliance_curriculum:
    # This source was generated against evaluator wording. Keep the artifact
    # for research, but never include it in the canonical training mixture.
    enabled: false
    limit: 0
  nemotron_instruction_following_chat_v3:
    enabled: true
    # Most raw rows are removed by language, artifact, identity, and context
    # filters. Oversample upstream so the final usable cap can actually fill.
    download_limit: 200000
    limit: 10000
  openhermes_2_5:
    enabled: true
    # Backbone breadth source (~1M ShareGPT rows aggregating many GPT-4
    # distilled sets). Draw the full dataset and let the length/English/
    # artifact filters in prepare_sft decide what survives.
    download_limit: 1000000
    limit: 10000
  alpaca:
    enabled: false
    limit: 12000
  no_robots:
    enabled: false
    limit: 8000
  general_assistant_instruction_qa_smoltalk_expansion:
    # Exact duplicate of the downloaded SmolTalk expansion in the live data.
    enabled: false
    limit: 8000
  smoltalk:
    enabled: true
    # Draw a larger upstream sample so the English/quality/context filters can
    # still produce a broad 180M-friendly final mixture.
    download_limit: 400000
    limit: 35000
  squad:
    enabled: true
    limit: 10000
  triviaqa:
    enabled: true
    limit: 5000
  sciq:
    # SciQ train has ~11.7k rows total; this cap effectively takes all of it.
    enabled: true
    limit: 8000
  arc_challenge:
    # ARC-Challenge train has ~1.1k rows; the cap already covers the full set.
    enabled: true
    limit: 1200
  openbookqa:
    # OpenBookQA main train has ~5k rows; the cap already covers the full set.
    enabled: true
    limit: 5000
  boolq:
    # BoolQ train has ~9.4k rows; this cap effectively takes all of it.
    enabled: true
    limit: 7000

corpus_source_plan:
  # Weights below are relative; scaled_corpus_source_plan() normalizes them to
  # target_processed_tokens (~10.53B) at runtime. The weights define a balanced
  # 10B-token training mix: 45% quality educational web, 15% reference/books,
  # 15% math, 15% educational code, and 10% technical/synthetic education.
  # Preparation refuses to publish a skewed shortfall.
  fineweb-edu:
    kind: web
    target_tokens: 4000000000
    target_raw_chars: 16000000000
    enabled: true
  dolma:
    kind: web
    target_tokens: 450000000
    target_raw_chars: 1800000000
    enabled: false
  refinedweb:
    kind: web
    target_tokens: 250000000
    target_raw_chars: 1000000000
    enabled: true
  fineweb_sample:
    kind: web
    target_tokens: 250000000
    target_raw_chars: 1000000000
    enabled: true
  c4_en:
    kind: web
    target_tokens: 0
    target_raw_chars: 0
    enabled: false
  gutenberg:
    kind: books
    target_tokens: 500000000
    target_raw_chars: 2000000000
    enabled: true
  wikipedia_snapshot:
    kind: reference
    target_tokens: 1000000000
    target_raw_chars: 4000000000
    enabled: true
  stackexchange:
    kind: technical
    target_tokens: 250000000
    target_raw_chars: 1000000000
    enabled: true
  openwebmath:
    kind: math
    target_tokens: 300000000
    target_raw_chars: 1200000000
    enabled: true
  arxiv:
    kind: technical
    target_tokens: 250000000
    target_raw_chars: 1000000000
    enabled: true
  finemath:
    kind: math
    target_tokens: 1200000000
    target_raw_chars: 4800000000
    enabled: true
  python_edu:
    kind: code
    target_tokens: 1500000000
    target_raw_chars: 6000000000
    enabled: true
  cosmopedia_v2:
    kind: synthetic_education
    target_tokens: 500000000
    target_raw_chars: 2000000000
    enabled: true
